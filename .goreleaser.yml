version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: isola
    main: .
    binary: isola
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # TODO: Windows support requires platform-specific process management
      # - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cyucelen/isola/cmd.version={{.Version}}
      - -X github.com/cyucelen/isola/cmd.commit={{.Commit}}
      - -X github.com/cyucelen/isola/cmd.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: isola
    binaries:
      - isola
    repository:
      owner: cyucelen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/cyucelen/isola
    description: "Isolated dev environment for every git worktree: ports, proxy, and databases"
    license: MIT
    # macOS quarantines downloaded unsigned binaries; strip the flag so `isola`
    # runs without a Gatekeeper "unverified developer" prompt.
    hooks:
      post:
        install: |
          if OS.mac? && File.exist?("#{staged_path}/isola")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/isola"]
          end

nfpms:
  - id: isola
    package_name: isola
    vendor: cyucelen
    homepage: https://github.com/cyucelen/isola
    maintainer: cyucelen <cagatayyucelen@gmail.com>
    description: "Isolated dev environment for every git worktree: ports, proxy, and databases"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

aurs:
  - name: isola-bin
    homepage: https://github.com/cyucelen/isola
    description: "Isolated dev environment for every git worktree: ports, proxy, and databases"
    maintainers:
      - "cyucelen <cagatayyucelen@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/isola-bin.git"
    provides:
      - isola
    conflicts:
      - isola
    package: |-
      install -Dm755 "./isola" "${pkgdir}/usr/bin/isola"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/isola-bin/LICENSE"

release:
  github:
    owner: cyucelen
    name: isola
  draft: false
  prerelease: auto
