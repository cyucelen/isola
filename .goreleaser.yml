version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: isola
    main: .
    binary: isola
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # TODO: Windows support requires platform-specific process management
      # - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cyucelen/isola/cmd.version={{.Version}}
      - -X github.com/cyucelen/isola/cmd.commit={{.Commit}}
      - -X github.com/cyucelen/isola/cmd.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: cyucelen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/cyucelen/isola
    description: Git Worktree Server Manager
    license: MIT
    install: |
      bin.install "isola"
    test: |
      system "#{bin}/isola", "version"

nfpms:
  - id: isola
    package_name: isola
    vendor: cyucelen
    homepage: https://github.com/cyucelen/isola
    maintainer: cyucelen <cagatayyucelen@gmail.com>
    description: Git Worktree Server Manager
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

release:
  github:
    owner: cyucelen
    name: isola
  draft: false
  prerelease: auto
